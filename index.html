<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0877bd">
<title>Programa de Predicación Pública</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18212b;font-size:16px;--blue:#0877bd;--line:#111;--light:#d7d7d7;--peach:#f5c5aa;--sky:#8fd4ef;--gray:#b9b9b9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:#d4e1eb;background-image:linear-gradient(135deg,#f7f9fb 0%,#e8edf1 38%,#dce7ee 72%,#cbdce8 100%);background-attachment:fixed}.container{max-width:1180px;margin:0 auto;padding:22px}.toolbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:8px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 3px 8px #102a4330}button:hover{filter:brightness(.92);transform:translateY(-1px)}
h1{margin:0;padding:20px 12px;text-align:center;color:var(--blue);font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;text-transform:uppercase;background:#ffffffeb;border:1px solid #fff;border-radius:14px;box-shadow:0 8px 24px #25334218}
.today{margin:20px 0 28px;border:2px solid #f2bd3b;border-radius:16px;overflow:hidden;background:#ffffffed;box-shadow:0 12px 28px #25334220}.today-label{text-align:center;padding:10px;background:#fff2c2;color:#553d00;font-weight:800;letter-spacing:.08em}.today h2{margin:0;padding:14px;text-align:center;background:var(--blue);color:white;text-transform:uppercase;font-size:1.15rem}.today .schedule{border:0}
.toolbar select{max-width:260px;border:1px solid #9aa9b4;border-radius:8px;padding:9px 10px;background:#fff;color:#18212b;font:inherit}.voice-control{display:flex;align-items:center;gap:7px;font-weight:700}.font-controls{display:flex;gap:6px}.font-controls button{min-width:44px}.natural-voice{margin:-8px 0 22px;padding:16px 18px;border-radius:12px;background:#ffffffd9;box-shadow:0 5px 18px #25334216;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.natural-voice h3{margin:0;font-size:1rem;color:#243746}.natural-voice label{display:flex;align-items:center;gap:8px}.natural-voice select{max-width:300px;padding:9px;border:1px solid #9aa9b4;border-radius:8px;background:white;font:inherit}.natural-voice p{flex-basis:100%;margin:0;color:#53636e;font-size:.9rem}.natural-voice audio{width:100%;height:42px}.dark{background:#18212b!important;color:#f3f6f8}.dark .today,.dark .day-card,.dark h1,.dark .natural-voice{background:#263441;color:#f3f6f8;border-color:#52616c}.dark .day-heading{background:#111a20}.dark .today-label{background:#51431e;color:#fff1c0}.dark .toolbar select,.dark .natural-voice select{background:#263441;color:#f3f6f8;border-color:#667783}.dark .natural-voice h3,.dark .natural-voice p{color:#e1eaf0}
.schedule{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}.schedule th,.schedule td{border:1px solid #202020;padding:7px 8px;text-align:center;font-size:clamp(.76rem,1.6vw,.98rem);line-height:1.2;font-weight:700}.schedule td{color:#111;overflow-wrap:anywhere}.schedule th{width:16.5%;background:var(--blue);color:#fff;text-transform:uppercase}.schedule th:nth-child(2){width:35%}.schedule th:nth-child(3),.schedule th:nth-child(4){width:24.25%}.schedule .time-row td{background:var(--blue);color:#fff;text-transform:uppercase}.schedule .day-cell{background:var(--blue);color:white;text-transform:uppercase;white-space:pre-line}.schedule .peach td{background:var(--peach)}.schedule .sky td{background:var(--sky)}.schedule .gray td{background:var(--gray)}.schedule .light td{background:var(--light)}.schedule .no-preaching{color:#e52323}.day-heading{margin:0 0 14px;padding:13px 16px;background:#263746;color:#fff;border-radius:11px;text-align:left;text-transform:uppercase;letter-spacing:.05em}.day-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:18px}.day-card{min-width:0;overflow:hidden;background:#ffffffed;border:1px solid #fff;border-radius:14px;box-shadow:0 8px 22px #25334220;transition:transform .18s ease,box-shadow .18s ease}.day-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #25334230}.day-card h3{margin:0;padding:13px 15px;background:var(--blue);color:#fff;text-align:center;text-transform:uppercase;font-size:1rem;letter-spacing:.03em}.day-card .schedule td:first-child{overflow-wrap:anywhere}.day-card .schedule tr:first-child td{border-top:0}.day-card .schedule tr:last-child td{border-bottom:0}.day-card .schedule td:first-child{border-left:0}.day-card .schedule td:last-child{border-right:0}.today .schedule td:first-child{overflow-wrap:anywhere}
@media(max-width:600px){.container{padding:12px}.toolbar{justify-content:center}.toolbar>button,.voice-control{flex:1}.toolbar select{width:100%;max-width:none}.natural-voice{align-items:stretch}.natural-voice label{flex:1;flex-wrap:wrap}.natural-voice select{max-width:none;flex:1;min-width:170px}.day-grid{grid-template-columns:1fr}.schedule th,.schedule td{padding:6px 4px;font-size:.74rem}.today{margin:14px 0 22px}}
</style>
</head>
<body>
<main class="container">
  <div class="toolbar" aria-label="Opciones de lectura y apariencia">
    <div class="font-controls" aria-label="Tamaño de letra"><button id="fontDown" type="button" title="Reducir letra">A−</button><button id="fontReset" type="button" title="Tamaño normal">A</button><button id="fontUp" type="button" title="Aumentar letra">A+</button></div>
    <label class="voice-control">Voz <select id="voiceSelect" aria-label="Elegir voz para la lectura"><option value="auto">Automática (masculina)</option></select></label>
    <button id="themeButton" type="button">Modo oscuro</button>
  </div>
  <h1>Predicación Pública Congregación Linderos</h1>
  <section class="today" aria-live="polite"><div class="today-label">PROGRAMA DE HOY</div><div id="todayContent"></div></section>
  <section class="natural-voice" aria-label="Voz natural por internet"><h3>Voz natural por internet</h3><label for="naturalVoice">Voz masculina en español</label><select id="naturalVoice"><option value="">Conectando…</option></select><button id="naturalListen" type="button">Generar audio</button><p id="naturalStatus" role="status">Requiere iniciar el servidor y configurar la API. El audio se genera al solicitarlo.</p><audio id="naturalAudio" controls hidden></audio></section>
  <h2 class="day-heading">Programa semanal</h2>
  <section class="day-grid" id="weekGrid" aria-label="Programa semanal"></section>
</main>
<script>
const programa=[
 {date:'2026-10-19',day:'Lunes',items:[
  ['10:00 a 12:00','Casa Hna Doris','Doris Salazar','Barbara Castro','light']]},
 {date:'2026-10-20',day:'Martes',items:[
  ['07:30 a 09:30','Colegio Cardenal R. Silva H.','Valentina Condores','Yasmina de Condores','peach'],
  ['','Colegio Tec. Don Bosco','Sin PP','Sin PP','peach'],
  ['HERMANO/A','','','','header'],
  ['','Departamentos lado A. Neghme','Virginia Céspedes','Karen Fook','gray'],
  ['','Departamentos lado A. Lagos','Sin PP','Sin PP','gray'],
  ['','Casa Hna Doris','Doris Salazar','Remy Ramirez','light']]},
 {date:'2026-10-21',day:'Miércoles',items:[
  ['09:30 a 11:30','A. Neghme/Cancha Rayada','Ángel Medina','Oscar Landívar','sky'],
  ['','A. Neghme/Cancha Rayada','Roberto Aros','Margarita de Aros','sky'],
  ['','Casa Hna Doris','Doris Salazar','Adriana Gonzalez','light']]},
 {date:'2026-10-22',day:'Jueves',items:[
  ['07:30 a 09:30','Colegio Cardenal R. Silva H.','Antonia Cárcamo','Karen Fook','peach'],
  ['','Colegio Tec. Don Bosco','Sin PP','Sin PP','peach'],
  ['09:30 a 11:30','Departamentos lado A. Neghme','Mireya Pastén','Erika Castro','gray'],
  ['','Departamentos lado A. Lagos','Sin PP','Sin PP','gray'],
  ['','Casa Hna Doris','Doris Salazar','Ivone de Mamani','light']]},
 {date:'2026-10-23',day:'Viernes',items:[
  ['09:30 a 11:30','A. Neghme/Cancha Rayada','Valentina Roco','Eleonora de Roco','sky'],
  ['','A. Neghme/Cancha Rayada','Héctor Cárcamo','Benjamín Manzano','sky'],
  ['','Casa Hna Doris','Doris Salazar','Katherine de Cárcamo','light']]},
 {date:'2026-10-24',day:'Sábado',items:[
  ['08:00 a 10:00','Neghme/Robinson Rojas','Jéssica Cortez','Danitza Beltrán','sky'],
  ['10:00 a 12:00','Cementerio Parque de la Paz','Sin PP','Sin PP','peach'],
  ['10:00 a 12:00','Plaza Megillones/Linderos','Sin PP','Sin PP','sky']]}
];
const fmtDate=(iso)=>new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z'));
const todayIso=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function renderRows(items,includeDay){return items.map((it,i)=>{const [time,place,a,b,color]=it;const dayCell=includeDay&&i===0?`<th class="day-cell" rowspan="${items.length+items.filter(x=>x[0]&&x[4]!=='header').length}">${window._dayName}<br>${window._dayDate}</th>`:'';if(color==='header')return `<tr class="time-row">${includeDay?'<td></td>':''}<td></td><td colspan="2">HERMANO/A</td></tr>`;const timeRow=time?`<tr class="time-row">${includeDay?'<td></td>':''}<td>${time}</td><td>HERMANO/A</td><td>HERMANO/A</td></tr>`:'';return `${timeRow}<tr class="${color}">${dayCell}<td>${place}</td><td class="${a==='Sin PP'?'no-preaching':''}">${a}</td><td class="${b==='Sin PP'?'no-preaching':''}">${b}</td></tr>`}).join('')}
function makeTable(day,compact=false){window._dayName=day.day;window._dayDate=fmtDate(day.date);const rows=renderRows(day.items,!compact);return `<table class="schedule"><tbody>${rows}</tbody></table>`}
function render(){const now=todayIso();const today=programa.find(d=>d.date===now);const box=document.getElementById('todayContent');if(today){box.innerHTML=`<h2>${today.day} · ${fmtDate(today.date)}</h2>${makeTable(today,true)}`}else{const d=new Date();const dayName=new Intl.DateTimeFormat('es-CL',{weekday:'long'}).format(d);box.innerHTML=`<h2>${dayName} · ${fmtDate(now)}</h2><p style="padding:12px;text-align:center">No hay datos publicados para hoy.</p>`}
document.getElementById('weekGrid').innerHTML=programa.map(day=>`<article class="day-card"><h3>${day.day} · ${fmtDate(day.date)}</h3><table class="schedule"><tbody>${renderRows(day.items,false)}</tbody></table></article>`).join('');
}
render();
const patronVozMasculina=/(^|[\s_#-])(manuel|jorge|diego|pablo|carlos|miguel|juan|alvaro|álvaro|raul|raúl|andres|andrés|antonio|enrique|francisco|jose|josé|mario|sergio|roberto|gonzalo|rodrigo|hernan|hernán|bruno|xavier|javier|fernando|alejandro|david|esteban|tomas|tomás)(?=$|[\s_#-])|male(?:[_-]?\d+)?|masculin/i;
function cargarVoces(){return new Promise(resolve=>{let voces=speechSynthesis.getVoices();if(voces.length){resolve(voces);return}const finalizar=()=>{voces=speechSynthesis.getVoices();if(voces.length){speechSynthesis.removeEventListener('voiceschanged',finalizar);resolve(voces)}};speechSynthesis.addEventListener('voiceschanged',finalizar);setTimeout(()=>{speechSynthesis.removeEventListener('voiceschanged',finalizar);resolve(speechSynthesis.getVoices())},1200)})}
async function actualizarSelectorVoces(){if(!('speechSynthesis'in window))return;const vocesEspanol=(await cargarVoces()).filter(v=>v.lang.toLowerCase().startsWith('es'));const selector=document.getElementById('voiceSelect');const previa=localStorage.getItem('vozPredicacion')||'auto';selector.innerHTML='<option value="auto">Automática (masculina)</option>'+vocesEspanol.map((v,i)=>`<option value="${i}">${v.name} · ${v.lang}</option>`).join('');selector.value=previa==='auto'||vocesEspanol[Number(previa)]?previa:'auto'}
if('speechSynthesis'in window){actualizarSelectorVoces();speechSynthesis.addEventListener('voiceschanged',actualizarSelectorVoces)}
function leerProgramaDeHoy(){const d=programa.find(x=>x.date===todayIso());if(!d)return;if(!('speechSynthesis'in window)){alert('Tu navegador no admite lectura en voz alta.');return}const vocesEspanol=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));const elegido=document.getElementById('voiceSelect').value;const vozMasculina=elegido==='auto'?vocesEspanol.find(v=>patronVozMasculina.test(v.name+' '+v.voiceURI)):null;const voz=elegido==='auto'?(vozMasculina||vocesEspanol[0]):vocesEspanol[Number(elegido)];if(!voz){alert('No hay voces en español disponibles en el teléfono. Descarga una voz española en los ajustes de texto a voz y vuelve a intentarlo.');return}const detalle=d.items.filter(item=>item[4]!=='header').map(([hora,lugar,a,b])=>{if(a==='Sin PP'&&b==='Sin PP')return `${hora?hora+'. ':''}${lugar}. No hay predicación programada en este lugar.`;return `${hora?hora+'. ':''}${lugar}. Participan ${a} y ${b}.`}).join(' ');const text=`Programa de predicación pública de hoy, ${d.day} ${fmtDate(d.date)}. ${detalle}`;speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=voz.lang;utterance.voice=voz;utterance.rate=.95;utterance.pitch=(elegido==='auto'&&!vozMasculina)?0.62:0.9;utterance.volume=1;speechSynthesis.speak(utterance)}
function textoDetallado(d){const detalle=d.items.filter(item=>item[4]!=='header').map(([hora,lugar,a,b])=>{if(a==='Sin PP'&&b==='Sin PP')return `${hora?hora+'. ':''}${lugar}. No hay predicación programada en este lugar.`;return `${hora?hora+'. ':''}${lugar}. Participan ${a} y ${b}.`}).join(' ');return `Programa de predicación pública de hoy, ${d.day} ${fmtDate(d.date)}. ${detalle}`}
async function cargarVocesNaturales(){const selector=document.getElementById('naturalVoice');const estado=document.getElementById('naturalStatus');try{const respuesta=await fetch('/api/voices');const datos=await respuesta.json();if(!respuesta.ok)throw new Error(datos.error||'No se pudieron cargar las voces.');selector.innerHTML='';if(!datos.voices.length){selector.innerHTML='<option value="">No hay voces españolas masculinas disponibles</option>';estado.textContent='La cuenta no devolvió voces masculinas en español. Revisa las voces habilitadas.';return}datos.voices.forEach((voz,i)=>{const opcion=document.createElement('option');opcion.value=voz.id;opcion.textContent=`${voz.name} — ${voz.accent}`;selector.appendChild(opcion)});const guardada=localStorage.getItem('vozNaturalId');if(guardada&&datos.voices.some(v=>v.id===guardada))selector.value=guardada;selector.addEventListener('change',()=>localStorage.setItem('vozNaturalId',selector.value));estado.textContent='Voces masculinas españolas listas. Si hay una chilena disponible, aparece primero.'}catch(error){selector.innerHTML='<option value="">Servidor de voz no conectado</option>';estado.textContent=error.message.includes('Failed to fetch')?'Para activar la voz natural, inicia el servidor local con node server.mjs y configura la API.':error.message}}
document.getElementById('naturalListen').addEventListener('click',async event=>{const d=programa.find(x=>x.date===todayIso());if(!d){document.getElementById('naturalStatus').textContent='No hay datos publicados para hoy.';return}const boton=event.currentTarget;const estado=document.getElementById('naturalStatus');const audio=document.getElementById('naturalAudio');const voiceId=document.getElementById('naturalVoice').value;if(!voiceId){estado.textContent='Selecciona una voz masculina española disponible.';return}boton.disabled=true;boton.textContent='Generando…';estado.textContent='Generando el audio. Esto puede tardar un momento.';try{const respuesta=await fetch('/api/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:textoDetallado(d),voiceId})});if(!respuesta.ok){const datos=await respuesta.json();throw new Error(datos.error||'No se pudo generar el audio.')}if(audio.dataset.url)URL.revokeObjectURL(audio.dataset.url);const url=URL.createObjectURL(await respuesta.blob());audio.src=url;audio.dataset.url=url;audio.hidden=false;estado.textContent='Audio listo. Pulsa reproducir para escucharlo.';try{await audio.play()}catch{estado.textContent='Audio listo. Pulsa reproducir en el reproductor.'}}catch(error){estado.textContent=error.message}finally{boton.disabled=false;boton.textContent='Generar audio'}});
if(location.protocol!=='file:')cargarVocesNaturales();
if(programa.some(x=>x.date===todayIso())){const listen=document.createElement('button');listen.type='button';listen.textContent='🔊 Escuchar programa de hoy';listen.style.cssText='display:block;margin:0 auto 18px';listen.onclick=leerProgramaDeHoy;document.querySelector('.today').appendChild(listen)}
const selectorVoz=document.getElementById('voiceSelect');selectorVoz.addEventListener('change',()=>localStorage.setItem('vozPredicacion',selectorVoz.value));
document.getElementById('themeButton').addEventListener('click',e=>{document.body.classList.toggle('dark');const oscuro=document.body.classList.contains('dark');localStorage.setItem('temaPredicacion',oscuro?'oscuro':'claro');e.currentTarget.textContent=oscuro?'Modo claro':'Modo oscuro'});if(localStorage.getItem('temaPredicacion')==='oscuro'){document.body.classList.add('dark');document.getElementById('themeButton').textContent='Modo claro'}
let fontSize=Number(localStorage.getItem('tamanoLetraPredicacion'))||16;function aplicarTamanoLetra(){fontSize=Math.min(24,Math.max(14,fontSize));document.documentElement.style.fontSize=fontSize+'px';localStorage.setItem('tamanoLetraPredicacion',fontSize)}aplicarTamanoLetra();document.getElementById('fontDown').addEventListener('click',()=>{fontSize-=1;aplicarTamanoLetra()});document.getElementById('fontUp').addEventListener('click',()=>{fontSize+=1;aplicarTamanoLetra()});document.getElementById('fontReset').addEventListener('click',()=>{fontSize=16;aplicarTamanoLetra()});
</script>
</body>
</html>
